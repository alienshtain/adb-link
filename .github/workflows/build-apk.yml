name: Build phone app (APK)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build the APK
        run: bash phone/setup.sh "$RUNNER_TEMP/adblink-app" --build
      - name: Name the file
        run: cp "$RUNNER_TEMP/adblink-app/build/app/outputs/flutter-apk/app-release.apk" adblink.apk
      - uses: actions/upload-artifact@v4
        with:
          name: adblink-apk
          path: adblink.apk
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: adblink.apk
